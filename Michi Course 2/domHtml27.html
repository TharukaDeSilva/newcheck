<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #timepassed{
            color: red;
            font-size: 50px;
            align-items: center;
            margin-left: 300px;
            border-style: dotted;
            
        }
    </style>
    <title>Date Now</title>
</head>
<body>
    <div><p>Current time from start: </p>
    <div id="timepassed"></div></div>
    
    <script>
        const pageLoaded  =  Date.now();
        const timePassedDiv = document.querySelector('#timepassed');
         setInterval(()=>{
            let timePassesd = (Date.now()- pageLoaded)/1000;
            timePassedDiv.textContent = Math.round(timePassesd)


        }, 1000)
    </script>
    
</body>
</html>
