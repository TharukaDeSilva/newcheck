<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async and Await functionality</title>
</head>
<body>
    <button>Start</button>
    <div id="feedback"></div>
    <script>
        const btn = document.querySelector('button');
        const feedback  = document.querySelector("#feedback");
        const delay = 5000;

        function getPromiseThatResolvesAfterDelay(delay){
            return new Promise((resolve, reject)=>{
                setTimeout(resolve, delay);
            });
        }

        btn.addEventListener("click",  async ()=>{
            feedback.textContent = "Started Timer";
            await getPromiseThatResolvesAfterDelay(delay);
            feedback.textContent = "Timer done!";

             
            


        })

    </script>
</body>
</html>
